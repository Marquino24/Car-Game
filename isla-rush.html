<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e2ad8b">
<title>Isla Rush</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.65); }
  .panel { background: rgba(8, 14, 24, .42); border-radius: 12px; padding: 8px 14px; }
  #laps {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    min-width: 150px;
  }
  #gfx {
    position: absolute; pointer-events: auto; cursor: pointer;
    top: calc(124px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 6px 10px;
  }
  #lapNum { font-size: 13px; font-weight: 700; letter-spacing: .14em; opacity: .9; }
  #lapTime { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .sub { font-size: 12px; opacity: .88; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .sub b { display: inline-block; width: 38px; font-weight: 600; opacity: .75; }
  #speedo {
    position: absolute; text-align: right;
    right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 12px;
  }
  #speed { font-size: 58px; font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums; }
  #kmh { font-size: 13px; font-weight: 700; opacity: .8; letter-spacing: .1em; }
  #gearBox { text-align: center; border-left: 2px solid rgba(255,255,255,.35); padding-left: 12px; }
  #gear { font-size: 40px; font-weight: 800; line-height: .95; color: #ffb36b; }
  #gearLbl { font-size: 11px; font-weight: 700; opacity: .75; letter-spacing: .14em; }
  #banner {
    position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
    font-size: 26px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
    opacity: 0; transition: opacity .45s;
  }
  #banner.show { opacity: 1; }
  #banner small { display: block; text-align: center; font-size: 14px; letter-spacing: .12em; opacity: .85; }
  #help {
    position: absolute; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom));
    font-size: 12px; line-height: 1.6; opacity: .9; transition: opacity 1.2s;
  }
  #help kbd {
    display: inline-block; min-width: 14px; padding: 0 5px; margin-right: 2px; border-radius: 4px; text-align: center;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); font: 600 11px/16px inherit;
  }
  #help.hide { opacity: 0; }
  body.touch #help { display: none; }
  body.touch #speedo {
    bottom: auto; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
  }
  body.touch #speed { font-size: 44px; }
  body.touch #gear { font-size: 32px; }

  /* ---------- TOUCH CONTROLS ---------- */
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto; box-sizing: border-box;
    border-radius: 20px; background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.38);
    color: rgba(255,255,255,.92); font-weight: 800; font-size: 14px; letter-spacing: .06em;
    display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  .tbtn.on { background: rgba(255,255,255,.4); border-color: rgba(255,255,255,.75); }
  .tbtn.arrow { font-size: 34px; }
  #t-left  { left: calc(14px + env(safe-area-inset-left));  bottom: calc(18px + env(safe-area-inset-bottom)); width: 92px; height: 92px; }
  #t-right { left: calc(116px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 92px; height: 92px; }
  #t-gas   { right: calc(14px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 92px; height: 140px; }
  #t-brake { right: calc(118px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 84px; height: 84px; }
  #t-hand  { right: calc(118px + env(safe-area-inset-right)); bottom: calc(114px + env(safe-area-inset-bottom)); width: 84px; height: 64px; font-size: 12px; }
  #t-reset { right: calc(12px + env(safe-area-inset-right)); top: calc(96px + env(safe-area-inset-top)); width: 70px; height: 46px; font-size: 12px; border-radius: 14px; }
  #t-cam   { right: calc(92px + env(safe-area-inset-right)); top: calc(96px + env(safe-area-inset-top)); width: 70px; height: 46px; font-size: 12px; border-radius: 14px; }

  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; background: #123; font-size: 16px; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="laps" class="panel">
    <div id="lapNum">LAP 1</div>
    <div id="lapTime">0:00.000</div>
    <div class="sub"><b>LAST</b><span id="lastLap">--:--.---</span></div>
    <div class="sub"><b>BEST</b><span id="bestLap">--:--.---</span></div>
  </div>
  <div id="gfx" class="panel" title="Graphics quality (G)">GFX</div>
  <div id="speedo" class="panel">
    <div>
      <div id="speed">0</div>
      <div id="kmh">KM/H</div>
    </div>
    <div id="gearBox">
      <div id="gear">N</div>
      <div id="gearLbl">GEAR</div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="help" class="panel">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / arrows drive &nbsp;
    <kbd>Space</kbd> handbrake &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>G</kbd> graphics
  </div>
</div>

<div id="touch">
  <div class="tbtn arrow" id="t-left"  data-ctl="left">&#9664;</div>
  <div class="tbtn arrow" id="t-right" data-ctl="right">&#9654;</div>
  <div class="tbtn" id="t-gas"   data-ctl="gas">GAS</div>
  <div class="tbtn" id="t-brake" data-ctl="brake">BRAKE</div>
  <div class="tbtn" id="t-hand"  data-ctl="hand">DRIFT</div>
  <div class="tbtn" id="t-reset" data-ctl="reset">RESET</div>
  <div class="tbtn" id="t-cam"   data-ctl="cam">CAM</div>
</div>

<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

if (typeof THREE === 'undefined') {
  const e = document.getElementById('err');
  e.style.display = 'flex';
  e.textContent = 'Could not load Three.js from the CDN. Check your connection and reload.';
  throw new Error('THREE missing');
}

/* =====================================================================
 * CONFIG
 * All tunable values live here. To add a car, add an entry to
 * CONFIG.cars. To edit the circuit, edit CONFIG.track.points
 * ([x, y, z, section] in metres; y = elevation). arc() is a helper
 * that expands a hairpin/arc into control points.
 * ===================================================================== */

/** Control points along a circular arc (angles in degrees, x = cos, z = sin). */
function arc(cx, cz, r, a0, a1, y0, y1, steps, section) {
  const out = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, a = (a0 + (a1 - a0) * t) * Math.PI / 180;
    out.push([cx + r * Math.cos(a), y0 + (y1 - y0) * t, cz + r * Math.sin(a), section]);
  }
  return out;
}

const CONFIG = {
  physics: {
    dt: 1 / 120,          // fixed physics step (s)
    maxSteps: 12,         // max physics steps per rendered frame
    gravity: 9.81,
    wallRestitution: 0.3, // bounciness of barriers
    wallFriction: 0.25,   // speed scrubbed along the wall on impact
  },

  track: {
    sampleSpacing: 2.5,   // metres between track samples (physics + mesh)
    widthSmoothing: 30,   // samples used to blend width between sections
    kerbWidth: 1.1,
    barrierHeight: 1.0,
    texRepeat: 20,        // metres per road texture tile
    sections: {
      seafront: { name: 'Seafront Boulevard', halfWidth: 9.0, offroad: 10, surface: 'grass', barrier: [0x2f6fd6, 0xf4f4f4], line: 0xffffff },
      beach:    { name: 'Beach Highway',      halfWidth: 7.5, offroad: 13, surface: 'sand',  barrier: [0xf4f4f4, 0xff6a3d], line: 0xffffff },
      mountain: { name: 'Mountain Pass',      halfWidth: 5.5, offroad: 7,  surface: 'grass', barrier: [0xd62828, 0xf4f4f4], line: 0xffffff },
    },
    // Closed loop. First point = start/finish line. [x, elevation, z, section]
    points: [
      // 1. Seafront boulevard: wide, gentle curves along the south coast
      [-450, 2, -690, 'seafront'], [-150, 2, -660, 'seafront'], [150, 2, -700, 'seafront'], [420, 2, -680, 'seafront'],
      // 2. Beach highway: long fast straights up the east coast, sweeping bend west
      [650, 2.5, -600, 'beach'], [780, 3, -420, 'beach'], [820, 4, -100, 'beach'], [810, 5, 250, 'beach'],
      [840, 6, 550, 'beach'], [800, 8, 780, 'beach'], [640, 10, 880, 'beach'], [350, 12, 900, 'beach'], [50, 16, 880, 'beach'],
      // 3. Mountain pass: climbing switchbacks, summit ridge, descending hairpin, long downhill run
      [-200, 24, 840, 'mountain'], [-410, 34, 800, 'mountain'],
      ...arc(-440, 770, 30, 90, 270, 36, 40, 4, 'mountain'),   // hairpin 1 (left)
      ...arc(-250, 710, 30, 90, -90, 50, 54, 4, 'mountain'),   // hairpin 2 (right)
      ...arc(-440, 650, 30, 90, 270, 64, 68, 4, 'mountain'),   // hairpin 3 (left)
      [-300, 72, 600, 'mountain'], [-200, 72, 500, 'mountain'], [-230, 66, 380, 'mountain'], [-350, 58, 320, 'mountain'],
      ...arc(-420, 290, 30, 90, 270, 52, 48, 4, 'mountain'),   // hairpin 4 (left, downhill)
      [-280, 42, 250, 'mountain'], [-260, 38, 170, 'mountain'], [-380, 30, 100, 'mountain'], [-520, 22, 0, 'mountain'],
      [-570, 14, -200, 'mountain'], [-620, 8, -400, 'mountain'], [-690, 4, -560, 'mountain'],
      [-640, 2, -660, 'seafront'],
    ],
  },

  // Surfaces: grip multiplier, extra drag (m/s²), top speed multiplier
  surfaces: {
    road:  { grip: 1.0,  drag: 0.0, topSpeedMul: 1.0,  shake: 0 },
    grass: { grip: 0.72, drag: 3.0, topSpeedMul: 0.5,  shake: 0.05 },
    sand:  { grip: 0.62, drag: 3.8, topSpeedMul: 0.42, shake: 0.04 },
  },

  cars: {
    brisaGT: {
      name: 'Brisa GT',
      color: 0xff7a1a,
      mass: 1280,             // kg (wall impulses)
      topSpeed: 240,          // km/h
      acceleration: 8.5,      // m/s² peak engine acceleration
      powerCurve: 2.2,        // how quickly acceleration fades towards top speed
      braking: 16,            // m/s²
      reverseSpeed: 35,       // km/h
      handbrakeDecel: 3.5,    // m/s²
      rollingDrag: 0.35,      // m/s² when coasting
      aeroDrag: 0.00025,      // * v² when coasting
      grip: 1.0,              // cornering grip (≈ 11 m/s² lateral at 1.0)
      lateralGrip: 9,         // how fast sideways slip is killed (1/s)
      driftFactor: 0.78,      // 0..1 rear grip lost on handbrake
      maxDriftAngle: 0.8,     // rad, drift assist keeps slides below this angle
      slideMomentum: 0.3,     // fraction of scrubbed sideways speed kept as forward speed
      maxSteer: 0.55,         // rad, front wheel angle at low speed
      highSpeedSteer: 0.3,    // fraction of maxSteer left at top speed
      understeer: 0.28,       // yaw reduction at top speed
      yawResponse: 7,         // how fast the car rotates towards the steering target
      steerSpeed: 4.0, steerSpeedHigh: 2.2, steerReturn: 6,
      weightTransfer: 0.18,   // grip gained on the front when braking (lost when accelerating)
      weightTransferRate: 5,
      slopeEffect: 0.6,       // how strongly hills slow / speed you up
      wheelbase: 2.6, trackWidth: 1.64, length: 4.5, width: 1.9,
      wheelRadius: 0.34, wheelWidth: 0.26, frontAxle: 1.35,
      gearShiftUp: [52, 88, 124, 162, 202], // km/h
      shiftTime: 0.14,
      visualPitch: 0.05, visualRoll: 0.006,
    },
  },
  playerCar: 'brisaGT',

  camera: {
    near: 0.2, far: 4200,
    chase: { distance: 6.0, distanceAtSpeed: 1.8, height: 2.0, heightAtSpeed: -0.2, lookHeight: 1.1, lookAhead: 4,
             yawLag: 4.5, offsetLag: 10, fov: 60, fovAtSpeed: 22 },
    hood:  { offset: [0, 1.28, 0.2], look: [0, 1.05, 30], fov: 70, fovAtSpeed: 14 },
  },

  world: {
    terrainSize: 2800, terrainCenter: [70, 100], seaLevel: 0, seed: 1337,
    sunDir: [0.55, 0.2, -0.8],                  // low south-east sun over the sea
    sunColor: 0xffc27a, sunIntensity: 1.15,
    hemiSky: 0xffdcb8, hemiGround: 0x4f5a3a, hemiIntensity: 0.55,
    fogColor: 0xe2ad8b, fogNear: 380, fogFar: 3000,
  },

  // Prop counts at density 1.0 (High). Lower qualities scale them down.
  scenery: {
    trees: 1800, palmClusters: 34, umbrellas: 70, scrub: 500, townBuildings: 46,
    buildingGap: [1, 4], lampSpacing: 32,
  },

  // Graphics quality presets (G key or the GFX button cycles them)
  quality: {
    low:    { pixelRatio: 1,   antialias: false, shadows: false, shadowMapSize: 0,    shadowRange: 0,  shadowCasters: 0,
              density: 0.4,  terrainSegments: 128, seaSegments: 48,  envMap: false, paint: 'phong',    anisotropy: 1 },
    medium: { pixelRatio: 1.5, antialias: false, shadows: true,  shadowMapSize: 1024, shadowRange: 45, shadowCasters: 1,
              density: 0.7,  terrainSegments: 160, seaSegments: 96,  envMap: true,  paint: 'standard', anisotropy: 4 },
    high:   { pixelRatio: 2,   antialias: true,  shadows: true,  shadowMapSize: 2048, shadowRange: 70, shadowCasters: 2,
              density: 1.0,  terrainSegments: 200, seaSegments: 120, envMap: true,  paint: 'physical', anisotropy: 8 },
  },
};

/* =====================================================================
 * UTILS
 * ===================================================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, rate, dt) => a + (b - a) * (1 - Math.exp(-rate * dt));
const moveTowards = (v, target, maxDelta) => (Math.abs(target - v) <= maxDelta ? target : v + Math.sign(target - v) * maxDelta);
function wrapAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return new THREE.CanvasTexture(c);
}
function formatTime(t) {
  if (t == null) return '--:--.---';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
}
const IS_TOUCH = (window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches) ||
                 (('ontouchstart' in window) && navigator.maxTouchPoints > 0 && !(window.matchMedia && window.matchMedia('(pointer: fine)').matches));

const _e = new THREE.Euler(0, 0, 0, 'YXZ'), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _sc = new THREE.Vector3();
/** Matrix from position, yaw, scale and optional tilt (rx about X, rz about Z); Euler order YXZ. */
function M(x = 0, y = 0, z = 0, yaw = 0, sx = 1, sy = sx, sz = sx, rx = 0, rz = 0) {
  _e.set(rx, yaw, rz, 'YXZ'); _q.setFromEuler(_e);
  return new THREE.Matrix4().compose(_p.set(x, y, z), _q, _sc.set(sx, sy, sz));
}
/** Merge [geometry, colourHex, matrix?] parts into one non-indexed geometry with vertex colours. */
function mergeGeos(parts, withUV = false) {
  let count = 0;
  const list = parts.map(([g, c, m]) => {
    const ng = g.index ? g.toNonIndexed() : g.clone();
    if (m) ng.applyMatrix4(m);
    if (!ng.attributes.normal) ng.computeVertexNormals();
    count += ng.attributes.position.count;
    return [ng, new THREE.Color(c)];
  });
  const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), col = new Float32Array(count * 3);
  const uv = withUV ? new Float32Array(count * 2) : null;
  let o = 0;
  for (const [g, c] of list) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    for (let i = 0; i < n; i++) { col[(o + i) * 3] = c.r; col[(o + i) * 3 + 1] = c.g; col[(o + i) * 3 + 2] = c.b; }
    if (uv && g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    o += n;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  if (uv) out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return out;
}

/* Graphics quality: ?q=low|medium|high, else the last choice, else Low on phones / High on desktop. */
const QUALITY_KEYS = ['low', 'medium', 'high'];
const QUALITY_NAME = (() => {
  const p = new URLSearchParams(location.search).get('q');
  if (QUALITY_KEYS.includes(p)) return p;
  try { const s = localStorage.getItem('islaRush.quality'); if (QUALITY_KEYS.includes(s)) return s; } catch (e) { /* storage blocked */ }
  return IS_TOUCH ? 'low' : 'high';
})();
const QUALITY = CONFIG.quality[QUALITY_NAME];

/* =====================================================================
 * TRACK
 * The spline is sampled every ~2.5 m. Those samples drive both the
 * road meshes and physics queries, so what you see is what you drive.
 * The corridor (road + off-road strip) is bounded by barriers.
 * ===================================================================== */
class Track {
  constructor(cfg) {
    this.cfg = cfg;
    const pts = cfg.points;
    this.sectionKeys = Object.keys(cfg.sections);
    this.curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, 'centripetal');
    this.curve.arcLengthDivisions = 4000;
    const n = this.n = Math.max(64, Math.round(this.curve.getLength() / cfg.sampleSpacing));

    const X = this.X = new Float64Array(n), Y = this.Y = new Float64Array(n), Z = this.Z = new Float64Array(n);
    const HW = this.HW = new Float32Array(n), OR = this.OR = new Float32Array(n);
    const SEC = this.SEC = new Uint8Array(n);
    const hwRaw = new Float32Array(n), orRaw = new Float32Array(n);
    const P = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      const t = this.curve.getUtoTmapping(i / n);
      this.curve.getPoint(t, P);
      X[i] = P.x; Y[i] = P.y; Z[i] = P.z;
      const f = t * pts.length, k = Math.floor(f) % pts.length, fr = f - Math.floor(f);
      const s0 = cfg.sections[pts[k][3]], s1 = cfg.sections[pts[(k + 1) % pts.length][3]];
      hwRaw[i] = lerp(s0.halfWidth, s1.halfWidth, fr);
      orRaw[i] = lerp(s0.offroad, s1.offroad, fr);
      SEC[i] = this.sectionKeys.indexOf(fr < 0.5 ? pts[k][3] : pts[(k + 1) % pts.length][3]);
    }
    // Smooth width changes between sections (circular moving average)
    const w = cfg.widthSmoothing;
    for (let i = 0; i < n; i++) {
      let a = 0, b = 0;
      for (let k = -w; k <= w; k++) { const j = (i + k + n) % n; a += hwRaw[j]; b += orRaw[j]; }
      HW[i] = a / (2 * w + 1); OR[i] = b / (2 * w + 1);
    }
    // Cumulative distance + per-sample horizontal right vectors
    this.DIST = new Float64Array(n + 1);
    this.RX = new Float32Array(n); this.RZ = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      this.DIST[i + 1] = this.DIST[i] + Math.hypot(X[j] - X[i], Z[j] - Z[i]);
      const p = (i - 1 + n) % n;
      let tx = X[j] - X[p], tz = Z[j] - Z[p]; const l = Math.hypot(tx, tz); tx /= l; tz /= l;
      this.RX[i] = -tz; this.RZ[i] = tx;  // right = (-fz, fx)
    }
    this.length = this.DIST[n];
    this.startIndex = 0;
    this._tmp = this.makeQuery();
  }

  makeQuery() {
    return { index: 0, t: 0, s: 0, lateral: 0, height: 0, grade: 0, halfWidth: 0, offroad: 0, tx: 0, tz: 1, rx: -1, rz: 0, section: 0 };
  }

  sectionOf(i) { return this.cfg.sections[this.sectionKeys[this.SEC[i]]]; }

  /** Closest point on the centreline near `hint` (local search, cheap). */
  query(x, z, hint, out, win = 12) {
    const n = this.n, X = this.X, Z = this.Z;
    let best = Infinity, bi = hint, bt = 0;
    for (let k = -win; k <= win; k++) {
      let i = (hint + k) % n; if (i < 0) i += n;
      const j = i + 1 === n ? 0 : i + 1;
      const ax = X[i], az = Z[i], dx = X[j] - ax, dz = Z[j] - az;
      let t = ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ax + dx * t - x, pz = az + dz * t - z, d2 = px * px + pz * pz;
      if (d2 < best) { best = d2; bi = i; bt = t; }
    }
    return this._fill(x, z, bi, bt, out);
  }

  /** Closest point on the whole track (used when there is no valid hint). */
  queryGlobal(x, z, out) {
    const n = this.n, X = this.X, Z = this.Z;
    let best = Infinity, bi = 0;
    for (let i = 0; i < n; i++) { const dx = X[i] - x, dz = Z[i] - z, d2 = dx * dx + dz * dz; if (d2 < best) { best = d2; bi = i; } }
    return this.query(x, z, bi, out, 2);
  }

  _fill(x, z, i, t, out) {
    const n = this.n, j = i + 1 === n ? 0 : i + 1;
    const dx = this.X[j] - this.X[i], dz = this.Z[j] - this.Z[i], len = Math.hypot(dx, dz) || 1e-6;
    const tx = dx / len, tz = dz / len, rx = -tz, rz = tx;
    const cx = this.X[i] + dx * t, cz = this.Z[i] + dz * t;
    out.index = i; out.t = t;
    out.s = this.DIST[i] + len * t;
    out.lateral = (x - cx) * rx + (z - cz) * rz;
    out.height = this.Y[i] + (this.Y[j] - this.Y[i]) * t;
    out.grade = (this.Y[j] - this.Y[i]) / len;
    out.halfWidth = this.HW[i] + (this.HW[j] - this.HW[i]) * t;
    out.offroad = this.OR[i] + (this.OR[j] - this.OR[i]) * t;
    out.tx = tx; out.tz = tz; out.rx = rx; out.rz = rz;
    out.section = this.SEC[i];
    return out;
  }

  /* ---------- Meshes ---------- */
  // Needs this.side / this.cut* (filled by World.classify) to style each roadside.
  build(scene, renderer, quality) {
    this.group = new THREE.Group();
    scene.add(this.group);
    this.buildRoad(renderer, quality);
    this.buildCorridor(quality);
    this.buildStartLine(quality);
  }

  buildRoad(renderer, quality) {
    const n = this.n, rep = this.cfg.texRepeat;
    const pos = new Float32Array((n + 1) * 2 * 3), uv = new Float32Array((n + 1) * 2 * 2), idx = [];
    for (let r = 0; r <= n; r++) {
      const i = r % n, hw = this.HW[i];
      const lx = this.X[i] - this.RX[i] * hw, lz = this.Z[i] - this.RZ[i] * hw;
      const rx = this.X[i] + this.RX[i] * hw, rz = this.Z[i] + this.RZ[i] * hw;
      pos.set([lx, this.Y[i], lz, rx, this.Y[i], rz], r * 6);
      const v = this.DIST[r] / rep;
      uv.set([0, v, 1, v], r * 4);
      if (r < n) { const a = r * 2; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();

    const tex = canvasTexture(256, 512, (g, w, h) => {
      g.fillStyle = '#3e3d40'; g.fillRect(0, 0, w, h);
      const rnd = mulberry32(7);
      for (let k = 0; k < 7000; k++) {
        const c = 46 + Math.floor(rnd() * 34);
        g.fillStyle = `rgb(${c + 3},${c},${c - 1})`;
        g.fillRect(rnd() * w, rnd() * h, 2, 2);
      }
      for (let k = 0; k < 14; k++) {             // a few repair patches
        g.fillStyle = `rgba(${rnd() < 0.5 ? '30,30,32' : '80,78,76'},0.18)`;
        g.fillRect(rnd() * w, rnd() * h, 20 + rnd() * 60, 10 + rnd() * 40);
      }
    });
    tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = Math.min(quality.anisotropy, renderer.capabilities.getMaxAnisotropy());
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex }));
    mesh.receiveShadow = quality.shadows;
    this.group.add(mesh);
  }

  /**
   * Lane markings, kerbs, off-road strips, barriers / sea wall / guardrails,
   * promenade paving, rock cuts and skirts: one vertex-coloured mesh.
   */
  buildCorridor(quality) {
    const n = this.n, pos = [], col = [];
    const C = new THREE.Color();
    const kerbW = this.cfg.kerbWidth, bh = this.cfg.barrierHeight;
    const rnd = mulberry32(99);
    const P = (i, o, dy) => [this.X[i] + this.RX[i] * o, this.Y[i] + dy, this.Z[i] + this.RZ[i] * o];
    const PA = (i, o, y) => [this.X[i] + this.RX[i] * o, y, this.Z[i] + this.RZ[i] * o];   // absolute height
    const pushV = (p, c) => { pos.push(p[0], p[1], p[2]); col.push(c.r, c.g, c.b); };
    const quad = (a, b, c, d, color) => { pushV(a, color); pushV(b, color); pushV(c, color); pushV(a, color); pushV(c, color); pushV(d, color); };
    // flat strip between lateral offsets (signed) at sample i and j
    const strip = (i, j, a1, a2, b1, b2, dy, color) => quad(P(i, a1, dy), P(i, a2, dy), P(j, b2, dy), P(j, b1, dy), color);
    // vertical wall at lateral offset oi/oj from dy0 to dy1
    const wall = (i, j, oi, oj, dy0, dy1, color) => quad(P(i, oi, dy0), P(j, oj, dy0), P(j, oj, dy1), P(i, oi, dy1), color);
    const sand = new THREE.Color(0xdcc28a), grass = new THREE.Color(0x6a9a3c), dirt = new THREE.Color(0x7b6a52);
    const white = 0xf2f2ee, yellow = 0xf2c230;

    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const sec = this.sectionOf(i), key = this.sectionKeys[this.SEC[i]];
      const hi = this.HW[i], hj = this.HW[j], ei = hi + this.OR[i], ej = hj + this.OR[j];
      const d = this.DIST[i];
      const kerbRed = Math.floor(d / 3) % 2 === 0;
      const barrierA = Math.floor(d / 4) % 2 === 0;
      const surf = sec.surface === 'sand' ? sand : grass;
      const line = (oi, oj, w, hex) => { C.setHex(hex); strip(i, j, oi - w / 2, oi + w / 2, oj - w / 2, oj + w / 2, 0.03, C); };

      // --- lane markings ---
      if (key === 'seafront') {                                  // 4 lanes: double yellow centre + dashed lane lines
        line(-0.2, -0.2, 0.15, yellow); line(0.2, 0.2, 0.15, yellow);
        if (d % 12 < 4.5) { line(-hi / 2, -hj / 2, 0.16, white); line(hi / 2, hj / 2, 0.16, white); }
      } else if (key === 'beach') {                              // 2 lanes: dashed centre
        if (d % 12 < 5) line(0, 0, 0.18, white);
      } else if (d % 10 < 4) {                                   // mountain: dashed yellow centre
        line(0, 0, 0.16, yellow);
      }

      for (const side of [-1, 1]) {
        const si = side > 0 ? 1 : 0, type = this.side[i * 2 + si];
        const S = (o) => o * side;
        // edge line
        line(S(hi - 0.42), S(hj - 0.42), 0.22, white);
        // kerb
        C.setHex(kerbRed ? 0xd8312a : 0xf2f2f2);
        strip(i, j, S(hi), S(hi + kerbW), S(hj), S(hj + kerbW), 0.03, C);
        // off-road strip
        C.copy(surf).offsetHSL(0, 0, (rnd() - 0.5) * 0.04);
        strip(i, j, S(hi + kerbW), S(ei), S(hj + kerbW), S(ej), -0.01, C);

        if (type === SIDE.SEA) {
          // low stone sea wall dropping straight into the ocean
          C.setHex(0xc9b48f).offsetHSL(0, 0, (rnd() - 0.5) * 0.05);
          wall(i, j, S(ei), S(ej), -0.4, 0.85, C);
          C.setHex(0xe0cfae); strip(i, j, S(ei), S(ei + 0.7), S(ej), S(ej + 0.7), 0.85, C);
          C.setHex(0x9c8a6c).offsetHSL(0, 0, (rnd() - 0.5) * 0.05);
          wall(i, j, S(ei + 0.7), S(ej + 0.7), -9, 0.85, C);
          continue;
        }
        if (type === SIDE.DROP) {
          // galvanised guardrail over the drop-off (posts are instanced in Scenery)
          C.setHex(0xc3c9ce); wall(i, j, S(ei + 0.12), S(ej + 0.12), 0.42, 0.78, C);
          C.setHex(0x9aa1a7); strip(i, j, S(ei + 0.12), S(ei + 0.22), S(ej + 0.12), S(ej + 0.22), 0.78, C);
          quad(P(i, S(ei), -0.3), P(i, S(ei + 8), -10), P(j, S(ej + 8), -10), P(j, S(ej), -0.3), dirt);
          continue;
        }
        // standard low barrier (front, top, back)
        C.setHex(barrierA ? sec.barrier[0] : sec.barrier[1]);
        wall(i, j, S(ei), S(ej), -0.4, bh, C);
        strip(i, j, S(ei), S(ei + 0.35), S(ej), S(ej + 0.35), bh, C);
        C.multiplyScalar(0.7);
        wall(i, j, S(ei + 0.35), S(ej + 0.35), -0.6, bh, C);

        if (type === SIDE.PROM) {
          // paved promenade in front of the seafront buildings
          C.setHex(Math.floor(d / 5) % 2 ? 0xd8cbb2 : 0xcdbfa4);
          strip(i, j, S(ei + 0.35), S(ei + 24), S(ej + 0.35), S(ej + 24), 0.02, C);
          C.setHex(0xb8a98d);
          wall(i, j, S(ei + 24), S(ej + 24), -4, 0.02, C);
        } else if (type === SIDE.CUT) {
          // rock face where the road is carved into the hillside
          const k = i * 2 + si, l = j * 2 + si;
          const rows = [
            [S(ei + 0.35), S(ej + 0.35), this.Y[i] - 0.6, this.Y[j] - 0.6],
            [S(ei + 2.5), S(ej + 2.5), this.cutA[k], this.cutA[l]],
            [S(ei + 14), S(ej + 14), this.cutB[k], this.cutB[l]],
            [S(ei + 30), S(ej + 30), this.cutC[k], this.cutC[l]],
          ];
          for (let r = 0; r < 3; r++) {
            const a = rows[r], b = rows[r + 1];
            C.setHex(r === 0 ? 0x857867 : r === 1 ? 0x8f8473 : 0x7d7a5c).offsetHSL(0, 0, (rnd() - 0.5) * 0.08);
            quad(PA(i, a[0], a[2]), PA(i, b[0], b[2]), PA(j, b[1], b[3]), PA(j, a[1], a[3]), C);
          }
        } else {
          quad(P(i, S(ei + 0.35), -0.6), P(i, S(ei + 8), -10), P(j, S(ej + 8), -10), P(j, S(ej + 0.35), -0.6), dirt);
        }
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    geo.computeVertexNormals();
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = quality.shadows;
    this.group.add(mesh);
  }

  buildStartLine(quality) {
    const i = this.startIndex, hw = this.HW[i];
    const yaw = Math.atan2(this.RZ[i], -this.RX[i]);                // forward = (rz, -rx)
    const checker = canvasTexture(128, 16, (g, w, h) => {
      for (let x = 0; x < w / 8; x++) for (let y = 0; y < 2; y++) {
        g.fillStyle = (x + y) % 2 ? '#111' : '#fafafa'; g.fillRect(x * 8, y * 8, 8, 8);
      }
    });
    checker.magFilter = THREE.NearestFilter;
    checker.wrapS = THREE.RepeatWrapping; checker.repeat.set(Math.round(hw / 2), 1);
    const line = new THREE.Mesh(new THREE.PlaneGeometry(hw * 2, 2), new THREE.MeshLambertMaterial({ map: checker, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
    line.rotation.order = 'YXZ'; line.rotation.set(-Math.PI / 2, yaw, 0);
    line.position.set(this.X[i], this.Y[i] + 0.035, this.Z[i]);
    line.receiveShadow = quality.shadows;
    this.group.add(line);

    // Gantry: frame (posts + beam + lights) in one mesh, banner faces in another
    const span = hw + 2.2, B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    const frame = mergeGeos([
      [B(0.6, 7.6, 0.6), 0xdedede, M(-span, 3.8, 0)], [B(0.6, 7.6, 0.6), 0xdedede, M(span, 3.8, 0)],
      [B(0.9, 0.3, 0.9), 0x555555, M(-span, 0.15, 0)], [B(0.9, 0.3, 0.9), 0x555555, M(span, 0.15, 0)],
      [B(span * 2 + 0.6, 1.9, 0.5), 0x2a2d33, M(0, 6.6, 0)],
      [B(span * 2 + 0.6, 0.18, 0.7), 0xff7a1a, M(0, 7.62, 0)],
    ]);
    const gantry = new THREE.Group();
    gantry.position.set(this.X[i], this.Y[i], this.Z[i]); gantry.rotation.y = yaw;
    const fm = new THREE.Mesh(frame, new THREE.MeshLambertMaterial({ vertexColors: true }));
    fm.castShadow = quality.shadows;
    gantry.add(fm);
    const bannerTex = canvasTexture(1024, 160, (g, w, h) => {
      const grd = g.createLinearGradient(0, 0, w, 0);
      grd.addColorStop(0, '#ff6a00'); grd.addColorStop(0.5, '#ff9a2e'); grd.addColorStop(1, '#ff6a00');
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      for (let x = 0; x < w; x += 32) { g.fillStyle = (x / 32) % 2 ? '#111' : '#fff'; g.fillRect(x, 0, 32, 14); g.fillRect(x + 16 * 0, h - 14, 32, 14); }
      g.fillStyle = '#fff'; g.font = 'italic 900 92px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowOffsetY = 4; g.shadowBlur = 6;
      g.fillText('ISLA RUSH', w / 2, h / 2 + 4);
    });
    bannerTex.anisotropy = 4;
    const face = new THREE.PlaneGeometry(span * 2 + 0.4, 1.75);
    const banner = mergeGeos([[face, 0xffffff, M(0, 6.6, 0.26)], [face, 0xffffff, M(0, 6.6, -0.26, Math.PI)]], true);
    gantry.add(new THREE.Mesh(banner, new THREE.MeshBasicMaterial({ map: bannerTex })));
    this.group.add(gantry);
  }
}

/* =====================================================================
 * TRACK › WORLD (terrain, coastline, sky, ocean, lighting environment)
 * Each roadside is classified (sea wall, promenade, beach, rock cut,
 * drop-off…) so the corridor, terrain and scenery can dress it.
 * Terrain is pulled down under the corridor so it never pokes through.
 * ===================================================================== */
const SIDE = { NORMAL: 0, SEA: 1, PROM: 2, BEACH_SEA: 3, BEACH_IN: 4, CUT: 5, DROP: 6 };

// Shared sky colour model (used by the sky dome and the ocean reflection)
const SKY_GLSL = `
uniform vec3 sunDir;
uniform vec3 hazeColor;
vec3 skyBase(vec3 d) {
  vec3 zenith = vec3(0.09, 0.40, 0.50);
  vec3 warm = vec3(1.00, 0.63, 0.36);
  vec3 cool = vec3(0.78, 0.66, 0.66);
  vec2 hs = normalize(sunDir.xz);
  vec2 hd = normalize(d.xz + vec2(1e-4));
  float az = 0.5 + 0.5 * dot(hd, hs);
  vec3 horizon = mix(cool, warm, az * az);
  float y = max(d.y, 0.0);
  vec3 col = mix(horizon, zenith, pow(y, 0.5));
  float sd = max(dot(d, sunDir), 0.0);
  col += vec3(1.0, 0.55, 0.25) * pow(sd, 5.0) * 0.35;
  col += vec3(1.0, 0.80, 0.55) * pow(sd, 60.0) * 0.6;
  col = mix(col, hazeColor, (1.0 - smoothstep(0.0, 0.10, d.y)) * 0.75);
  return col;
}`;

class World {
  constructor(track, cfg, quality) {
    this.track = track; this.cfg = cfg; this.Q = quality;
    this.sunDir = new THREE.Vector3().fromArray(cfg.sunDir).normalize();
  }

  /** 1 = solid land, 0 = open sea. */
  landMask(x, z) {
    const wob = 25 * Math.sin(x * 0.009) + 18 * Math.sin(z * 0.013 + 1);
    const r = Math.hypot((x - 80) / 1180, (z - 160) / 1120) + wob / 2000;
    const north = 1 - smoothstep(985, 1085, z + wob) * smoothstep(-350, -50, x);
    return smoothstep(-860, -748, z + wob * 0.6) * (1 - smoothstep(905, 1010, x + wob * 0.6)) *
           (1 - smoothstep(0.88, 1.0, r)) * north;
  }

  baseHeight(x, z) {
    let h = 7 + 3 * Math.sin(x * 0.011) * Math.cos(z * 0.013) + 2 * Math.sin((x + z) * 0.023);
    const dx = x + 380, dz = z - 520;
    h += 125 * Math.exp(-(dx * dx + dz * dz) / (2 * 340 * 340));                 // mountain massif
    h += 22 * Math.max(0, Math.sin(x * 0.006 + 1.3) * Math.cos(z * 0.007 - 0.4)); // ridges
    return lerp(-10, h, this.landMask(x, z));
  }

  dunes(x, z) {
    return 3.2 * (0.5 + 0.5 * Math.sin(x * 0.045 + z * 0.02)) * (0.5 + 0.5 * Math.sin(z * 0.06 - x * 0.013));
  }

  /** Terrain height + distance from the corridor edge + roadside type. */
  heightAt(x, z) {
    const T = this.track, n = T.n, X = T.X, Z = T.Z, Y = T.Y;
    let best = Infinity, bi = 0, clampH = Infinity;
    for (let i = 0; i < n; i += 2) {
      const dx = X[i] - x, dz = Z[i] - z, d2 = dx * dx + dz * dz;
      if (d2 < best) { best = d2; bi = i; }
      if (d2 < 6400) {
        const e = Math.max(0, Math.sqrt(d2) - (T.HW[i] + T.OR[i]) - 4);
        const lim = Y[i] - 1.5 + e * e * 0.02;
        if (lim < clampH) clampH = lim;
      }
    }
    const d = Math.sqrt(best), edge = T.HW[bi] + T.OR[bi];
    const lat = (x - X[bi]) * T.RX[bi] + (z - Z[bi]) * T.RZ[bi];
    const type = T.side ? T.side[bi * 2 + (lat > 0 ? 1 : 0)] : SIDE.NORMAL;
    let base = this.baseHeight(x, z), k = smoothstep(edge + 3, edge + 70, d);
    if (type === SIDE.SEA) { base = Math.min(base, -6); k = smoothstep(edge + 0.5, edge + 9, d); }
    else if (type === SIDE.PROM && d < edge + 30) base = Math.min(base, Y[bi] - 0.3), k = 1;
    else if (type === SIDE.BEACH_IN) base += this.dunes(x, z) * smoothstep(edge + 4, edge + 25, d);
    else if (type === SIDE.BEACH_SEA) base = Math.min(base, Y[bi] - 0.8 - Math.max(0, d - edge) * 0.06);   // beach slopes to the water
    else if (type === SIDE.CUT) k = smoothstep(edge + 3, edge + 40, d);
    else if (type === SIDE.DROP) {                         // carve a drop-off, but never below sea level
      const carved = Math.min(base, Math.max(Y[bi] - 3 - Math.max(0, d - edge) * 0.45, 4));
      base = lerp(carved, base, smoothstep(edge + 120, edge + 260, d));   // only near the road
      k = smoothstep(edge + 1, edge + 30, d);
    }
    const h = lerp(Y[bi] - 1.2, base, k);
    return { h: Math.min(h, clampH), d: d - edge, type, bi };
  }

  /** Decide what lies beside each side of the road. */
  classify() {
    const T = this.track, n = T.n;
    T.side = new Uint8Array(n * 2);
    T.cutA = new Float32Array(n * 2); T.cutB = new Float32Array(n * 2); T.cutC = new Float32Array(n * 2);
    // signed curvature (+ = turning right) and radius per sample
    T.turn = new Float32Array(n); T.radius = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const a = (i - 4 + n) % n, c = (i + 4) % n;
      const ta = Math.atan2(T.RZ[a], -T.RX[a]), tc = Math.atan2(T.RZ[c], -T.RX[c]);
      const ang = wrapAngle(tc - ta), ds = T.DIST[i] - T.DIST[a] + T.DIST[c] - T.DIST[i];
      T.turn[i] = -Math.sign(ang);            // heading decreasing = turning right
      T.radius[i] = Math.abs(ang) > 1e-5 ? Math.abs((ds > 0 ? ds : 20) / ang) : 1e6;
    }
    for (let i = 0; i < n; i++) {
      const key = T.sectionKeys[T.SEC[i]], e = T.HW[i] + T.OR[i];
      for (const side of [-1, 1]) {
        const o = side * (e + 150);
        const hx = T.X[i] + T.RX[i] * o, hz = T.Z[i] + T.RZ[i] * o;
        const here = this.landMask(hx, hz), there = this.landMask(T.X[i] - T.RX[i] * o, T.Z[i] - T.RZ[i] * o);
        // the side with less land is the sea; on a tie, the side facing away from the island centre
        const c = this.cfg.terrainCenter;
        const seaward = Math.abs(here - there) > 0.01 ? here < there
          : (T.RX[i] * side * (T.X[i] - c[0]) + T.RZ[i] * side * (T.Z[i] - c[1])) > 0;
        let type = SIDE.NORMAL;
        if (key === 'seafront') type = seaward ? SIDE.SEA : SIDE.PROM;
        else if (key === 'beach') type = seaward ? SIDE.BEACH_SEA : SIDE.BEACH_IN;
        T.side[i * 2 + (side > 0 ? 1 : 0)] = type;
      }
    }
    // Mountain: rock cuts on the uphill side, guardrails on drop-offs
    const raw = new Int8Array(n * 2);
    for (let i = 0; i < n; i++) {
      if (T.sectionKeys[T.SEC[i]] !== 'mountain') continue;
      const e = T.HW[i] + T.OR[i];
      const hb = [-1, 1].map(side => this.baseHeight(T.X[i] + T.RX[i] * side * (e + 25), T.Z[i] + T.RZ[i] * side * (e + 25)));
      const lowSide = hb[0] < hb[1] ? 0 : 1, slope = Math.abs(hb[1] - hb[0]);
      for (const si of [0, 1]) {
        const side = si ? 1 : -1;
        if (T.turn[i] === side && T.radius[i] < 90) continue;     // inside of a tight bend: leave plain
        // hillside road: the lower side falls away (guardrail), the upper side is cut into the rock
        if (slope > 8 && si === lowSide) raw[i * 2 + si] = -1;
        else raw[i * 2 + si] = hb[si] > T.Y[i] + 6 ? 1 : hb[si] < T.Y[i] - 5 ? -1 : 0;
      }
    }
    for (let i = 0; i < n; i++) {
      for (let si = 0; si < 2; si++) {
        let sum = 0;
        for (let k = -5; k <= 5; k++) sum += raw[((i + k + n) % n) * 2 + si];
        const k2 = i * 2 + si;
        if (sum >= 6) T.side[k2] = SIDE.CUT;
        else if (sum <= -6) T.side[k2] = SIDE.DROP;
      }
    }
    // rock-cut profile heights (needs the classification above)
    for (let i = 0; i < n; i++) for (let si = 0; si < 2; si++) {
      const k = i * 2 + si;
      if (T.side[k] !== SIDE.CUT) continue;
      const side = si ? 1 : -1, e = T.HW[i] + T.OR[i];
      const at = (off) => this.heightAt(T.X[i] + T.RX[i] * side * (e + off), T.Z[i] + T.RZ[i] * side * (e + off)).h;
      const nat = this.baseHeight(T.X[i] + T.RX[i] * side * (e + 25), T.Z[i] + T.RZ[i] * side * (e + 25));
      const hc = clamp((nat - T.Y[i]) * 0.45, 2.5, 11);
      T.cutA[k] = T.Y[i] + hc;
      T.cutB[k] = Math.max(T.Y[i] + hc + 1, at(14));
      T.cutC[k] = at(30) - 3;                       // dive under the terrain so no ledge shows
    }
  }

  build(scene, renderer) {
    this.buildTerrain(scene);
    this.buildSea(scene);
    this.buildSky(scene, renderer);
  }

  buildTerrain(scene) {
    const W = this.cfg, segs = this.Q.terrainSegments;
    const geo = new THREE.PlaneGeometry(W.terrainSize, W.terrainSize, segs, segs);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3);
    const info = new Array(pos.count);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) + W.terrainCenter[0], z = pos.getZ(i) + W.terrainCenter[1];
      const r = this.heightAt(x, z);
      pos.setXYZ(i, x, r.h, z);
      info[i] = r;
    }
    geo.computeVertexNormals();
    const nor = geo.attributes.normal;
    const C = new THREE.Color(), rnd = mulberry32(W.seed);
    const cSand = new THREE.Color(0xe6cc94), cWet = new THREE.Color(0xa88f62), cGrass = new THREE.Color(0x76a240),
          cForest = new THREE.Color(0x2f6a2c), cRock = new THREE.Color(0x8d8273), cDirt = new THREE.Color(0x8a7656),
          cScrub = new THREE.Color(0x9a9a55), cPave = new THREE.Color(0xc9bba0);
    for (let i = 0; i < pos.count; i++) {
      const { h, d, type } = info[i];
      const x = pos.getX(i), z = pos.getZ(i), ny = nor.getY(i);
      const coast = this.landMask(x, z);
      if (h < 0.6) C.copy(cWet);
      else if (type === SIDE.PROM && d < 26) C.copy(cPave);
      else if (h < 3.2 || coast < 0.93 || (type === SIDE.BEACH_SEA && d < 220)) C.copy(cSand);
      else if (type === SIDE.BEACH_IN && d < 110) C.copy(cSand).lerp(cScrub, smoothstep(0.3, 0.9, rnd()) * 0.6 + smoothstep(40, 110, d) * 0.3);
      else {
        C.copy(cGrass).lerp(cForest, clamp(smoothstep(15, 60, h) * 0.85 + (rnd() - 0.5) * 0.25, 0, 1));
        if (ny < 0.8 && h > 6) C.lerp(cRock, smoothstep(0.8, 0.62, ny));
        if (h > 115) C.lerp(cRock, 0.6);
        if (d < 10) C.lerp(cDirt, 0.3);
      }
      C.offsetHSL(0, 0, (rnd() - 0.5) * 0.03);
      colors.set([C.r, C.g, C.b], i * 3);
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
    mesh.receiveShadow = this.Q.shadows;
    scene.add(mesh);
  }

  buildSea(scene) {
    const W = this.cfg;
    const geo = new THREE.PlaneGeometry(9000, 9000, this.Q.seaSegments, this.Q.seaSegments);
    geo.rotateX(-Math.PI / 2);
    geo.translate(W.terrainCenter[0], W.seaLevel, W.terrainCenter[1]);
    this.seaMat = new THREE.ShaderMaterial({
      uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
        time: { value: 0 }, sunDir: { value: this.sunDir.clone() },
        hazeColor: { value: new THREE.Color(W.fogColor) }, sunColor: { value: new THREE.Color(W.sunColor) },
      }]),
      fog: true,
      vertexShader: `
        uniform float time;
        varying vec3 vWorld;
        #include <fog_pars_vertex>
        void main() {
          vec4 w = modelMatrix * vec4(position, 1.0);
          w.y += 0.22 * sin(w.x * 0.045 + time * 0.8) + 0.14 * sin(w.z * 0.06 + time * 1.15);
          vWorld = w.xyz;
          vec4 mvPosition = viewMatrix * w;
          gl_Position = projectionMatrix * mvPosition;
          #include <fog_vertex>
        }`,
      fragmentShader: `
        uniform float time;
        uniform vec3 sunColor;
        varying vec3 vWorld;
        #include <fog_pars_fragment>
        ${SKY_GLSL}
        vec2 wave(vec2 p, vec2 dir, float freq, float speed, float amp) {
          return dir * cos(dot(p, dir) * freq + time * speed) * amp * freq;
        }
        void main() {
          vec2 p = vWorld.xz;
          float dist = length(cameraPosition - vWorld);
          vec2 g = wave(p, vec2(0.96, 0.28), 0.07, 1.0, 0.45) + wave(p, vec2(-0.37, 0.93), 0.12, 1.4, 0.26)
                 + wave(p, vec2(0.66, -0.75), 0.29, 2.2, 0.09) + wave(p, vec2(-0.98, -0.2), 0.61, 3.0, 0.035)
                 + wave(p, vec2(0.2, 0.98), 1.3, 4.1, 0.012);
          g /= 1.0 + dist * 0.0025;
          vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
          vec3 v = normalize(cameraPosition - vWorld);
          float fres = 0.03 + 0.97 * pow(1.0 - max(dot(n, v), 0.0), 5.0);
          vec3 r = reflect(-v, n); r.y = abs(r.y);
          vec3 refl = skyBase(r);
          vec3 deep = vec3(0.02, 0.20, 0.30), shallow = vec3(0.05, 0.42, 0.46);
          vec3 water = mix(shallow, deep, smoothstep(30.0, 400.0, dist));
          vec3 col = mix(water, refl, clamp(fres * 0.9 + 0.08, 0.0, 1.0));
          float s = max(dot(r, sunDir), 0.0);
          col += sunColor * (pow(s, 600.0) * 5.0 + pow(s, 60.0) * 0.45);
          gl_FragColor = vec4(col, 1.0);
          #include <fog_fragment>
        }`,
    });
    scene.add(new THREE.Mesh(geo, this.seaMat));
  }

  makeSkyMaterial() {
    return new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 }, sunDir: { value: this.sunDir.clone() }, hazeColor: { value: new THREE.Color(this.cfg.fogColor) } },
      side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: `
        varying vec3 vDir;
        void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float time;
        varying vec3 vDir;
        ${SKY_GLSL}
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
        void main() {
          vec3 d = normalize(vDir);
          vec3 col = skyBase(d);
          float sd = max(dot(d, sunDir), 0.0);
          col += vec3(1.0, 0.9, 0.7) * smoothstep(0.9990, 0.9995, sd) * 1.6;      // sun disc
          if (d.y > 0.0) {                                                          // a few soft clouds
            vec2 uv = d.xz / (d.y + 0.15) * 1.2 + vec2(time * 0.004, 0.0);
            float c = smoothstep(0.60, 0.80, fbm(uv)) * smoothstep(0.02, 0.16, d.y) * (1.0 - smoothstep(0.5, 0.85, d.y));
            vec3 cc = mix(vec3(0.93, 0.70, 0.64), vec3(1.0, 0.90, 0.74), pow(sd, 3.0));
            col = mix(col, cc, c * 0.8);
          }
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
  }

  buildSky(scene, renderer) {
    this.skyMat = this.makeSkyMaterial();
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(3800, 32, 16), this.skyMat);
    this.sky.renderOrder = -1;
    this.sky.frustumCulled = false;
    scene.add(this.sky);
    // Reflection environment for the car paint: a small sky cube map painted on 2D canvases
    // (no GPU pre-pass, so it behaves the same on every device)
    if (this.Q.envMap) this.envMap = this.makeEnvCube(64);
  }

  /** JS twin of the sky shader, used to paint the reflection cube map. */
  skyColorJS(dx, dy, dz, out) {
    const sd = this.sunDir, haze = new THREE.Color(this.cfg.fogColor);
    const hl = Math.hypot(dx, dz) || 1e-4, sl = Math.hypot(sd.x, sd.z);
    const az = 0.5 + 0.5 * (dx * sd.x + dz * sd.z) / (hl * sl);
    const warm = [1.0, 0.63, 0.36], cool = [0.78, 0.66, 0.66], zen = [0.09, 0.40, 0.50];
    const t = Math.pow(Math.max(dy, 0), 0.5), sdot = Math.max(dx * sd.x + dy * sd.y + dz * sd.z, 0);
    const hz = smoothstep(0, 0.1, dy);
    for (let c = 0; c < 3; c++) {
      const hor = lerp(cool[c], warm[c], az * az);
      let v = lerp(hor, zen[c], t) + [1, 0.55, 0.25][c] * Math.pow(sdot, 5) * 0.35 + [1, 0.8, 0.55][c] * Math.pow(sdot, 60) * 0.6;
      v = lerp(v, [haze.r, haze.g, haze.b][c], (1 - hz) * 0.75);
      if (dy < -0.02) v = lerp(v, [0.30, 0.34, 0.24][c], smoothstep(-0.02, -0.2, dy));   // ground bounce
      out[c] = Math.min(255, Math.round(v * 255));
    }
    return out;
  }

  makeEnvCube(size) {
    const faces = [];
    const dirs = [
      (u, v) => [1, -v, -u], (u, v) => [-1, -v, u], (u, v) => [u, 1, v],
      (u, v) => [u, -1, -v], (u, v) => [u, -v, 1], (u, v) => [-u, -v, -1],
    ];
    const rgb = [0, 0, 0];
    for (const dir of dirs) {
      const cv = document.createElement('canvas'); cv.width = cv.height = size;
      const g = cv.getContext('2d'), img = g.createImageData(size, size);
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        const [dx, dy, dz] = dir((x + 0.5) / size * 2 - 1, (y + 0.5) / size * 2 - 1);
        const l = Math.hypot(dx, dy, dz);
        this.skyColorJS(dx / l, dy / l, dz / l, rgb);
        const k = (y * size + x) * 4;
        img.data[k] = rgb[0]; img.data[k + 1] = rgb[1]; img.data[k + 2] = rgb[2]; img.data[k + 3] = 255;
      }
      g.putImageData(img, 0, 0);
      faces.push(cv);
    }
    const tex = new THREE.CubeTexture(faces);
    tex.needsUpdate = true;
    return tex;
  }

  update(dt, camera) {
    this.seaMat.uniforms.time.value += dt;
    this.skyMat.uniforms.time.value += dt;
    this.sky.position.copy(camera.position);
  }
}

/* =====================================================================
 * TRACK › SCENERY
 * Every repeated prop is one InstancedMesh (merged, vertex-coloured
 * geometry + optional per-instance tint). Densities scale with the
 * graphics quality.
 * ===================================================================== */
class Scenery {
  constructor(track, world, quality, scene) {
    this.T = track; this.W = world; this.Q = quality; this.scene = scene;
    this.rnd = mulberry32(4242);
    this.posts = [];                      // shared sign posts (chevrons, boards, district signs)
    this.buildings = { 2: [], 3: [], 4: [] };
    this.balconies = []; this.cornices = [];
    this.vc = new THREE.MeshLambertMaterial({ vertexColors: true });
    this.vc2 = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    this.townCenter = [230, 60];
  }

  build() {
    this.trees();
    this.seafront();
    this.town();
    this.flushBuildings();
    this.beach();
    this.mountain();
    this.districtSigns();
    this.distant();
    this.flushPosts();
  }

  count(base) { return Math.max(1, Math.round(base * this.Q.density)); }
  at(i, o, dy = 0) { const T = this.T; return { x: T.X[i] + T.RX[i] * o, y: T.Y[i] + dy, z: T.Z[i] + T.RZ[i] * o }; }
  fwdYaw(i) { return Math.atan2(this.T.RZ[i], -this.T.RX[i]); }
  /** Yaw that makes local +Z point from side `side` back towards the road. */
  faceRoadYaw(i, side) { return Math.atan2(-side * this.T.RX[i], -side * this.T.RZ[i]); }
  edge(i) { return this.T.HW[i] + this.T.OR[i]; }
  sideType(i, side) { return this.T.side[i * 2 + (side > 0 ? 1 : 0)]; }
  ahead(i, metres) { const n = this.T.n; return (i + Math.round(metres / this.T.cfg.sampleSpacing) + n * 4) % n; }
  samplesOf(key) { const out = []; for (let i = 0; i < this.T.n; i++) if (this.T.sectionKeys[this.T.SEC[i]] === key) out.push(i); return out; }

  instanced(geo, mat, items, cast = 0, receive = false) {
    if (!items.length) return null;
    const mesh = new THREE.InstancedMesh(geo, mat, items.length);
    const C = new THREE.Color();
    // always set a colour: r128 shares programs per material, so mixing tinted/untinted instancing on one material breaks
    items.forEach((it, k) => { mesh.setMatrixAt(k, it.m); mesh.setColorAt(k, C.setHex(it.c !== undefined ? it.c : 0xffffff)); });
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.frustumCulled = false;           // instances span the whole island
    mesh.castShadow = this.Q.shadows && cast > 0 && this.Q.shadowCasters >= cast;
    mesh.receiveShadow = this.Q.shadows && receive;
    this.scene.add(mesh);
    return mesh;
  }

  /* ---------- geometry ---------- */
  static pineGeo() {
    return mergeGeos([
      [new THREE.CylinderGeometry(0.22, 0.35, 3, 5), 0x6b4a2f, M(0, 1.5, 0)],
      [new THREE.ConeGeometry(2.6, 5.5, 7), 0x2c6532, M(0, 5, 0)],
      [new THREE.ConeGeometry(1.9, 4.2, 7), 0x3a7a38, M(0, 7.6, 0)],
    ]);
  }

  static palmGeo() {
    const parts = [], H = 8.5, segs = 4, pt = (y) => [0, y, 0.035 * y * y];
    for (let k = 0; k < segs; k++) {
      const a = pt(k * H / segs), b = pt((k + 1) * H / segs);
      const len = Math.hypot(b[1] - a[1], b[2] - a[2]), ang = Math.atan2(b[2] - a[2], b[1] - a[1]), rad = 0.3 - k * 0.035;
      parts.push([new THREE.CylinderGeometry(rad - 0.03, rad, len * 1.05, 5, 1, true), k % 2 ? 0x8a6a48 : 0x76583a,
        M(0, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2, 0, 1, 1, 1, ang)]);
    }
    const top = pt(H);
    const frond = new THREE.BufferGeometry();
    const L0 = [-0.1, 0, 0], R0 = [0.1, 0, 0], Lm = [-0.8, 0.45, 2], Rm = [0.8, 0.45, 2], Mm = [0, 0.65, 2], Tp = [0, -1.4, 4.2];
    frond.setAttribute('position', new THREE.Float32BufferAttribute([...L0, ...R0, ...Mm, ...L0, ...Mm, ...Lm, ...R0, ...Rm, ...Mm, ...Lm, ...Mm, ...Tp, ...Mm, ...Rm, ...Tp], 3));
    frond.computeVertexNormals();
    for (let f = 0; f < 8; f++) {
      const yaw = f / 8 * Math.PI * 2 + (f % 2) * 0.2, s = 0.9 + (f % 3) * 0.12;
      parts.push([frond, f % 2 ? 0x3f8a2c : 0x55a034, M(top[0], top[1], top[2], yaw, s, s, s, -0.1 + (f % 3) * 0.12)]);
    }
    const nut = new THREE.IcosahedronGeometry(0.2, 0);
    for (let k = 0; k < 2; k++) parts.push([nut, 0x5a3d1e, M(top[0] + Math.sin(k * 2.1) * 0.25, top[1] - 0.25, top[2] + Math.cos(k * 2.1) * 0.25)]);
    return mergeGeos(parts);
  }

  static facade(stories) {
    const ppm = 24, W = 256, Hm = 3 + 3.6 + (stories - 1) * 3.4 + 0.8, H = Math.ceil(Hm * ppm);
    const tex = canvasTexture(W, H, (g) => {
      const y = (m) => H - m * ppm;                           // metres from the bottom (3 m underground) → px
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
      g.fillStyle = '#b9b0a3'; g.fillRect(0, y(3.35), W, 3.35 * ppm);                 // plinth
      g.fillStyle = '#ece6da';
      for (let f = 1; f < stories; f++) g.fillRect(0, y(3 + 3.6 + (f - 1) * 3.4) - 4, W, 8); // floor bands
      g.fillRect(0, 0, W, 0.8 * ppm);                                                  // parapet
      for (let c = 0; c < 3; c++) {
        const cx = (c + 0.5) * W / 3;
        // ground floor: arched doors with white surrounds
        const dw = 1.3 * ppm, dh = 2.7 * ppm, base = y(3);
        g.fillStyle = '#f4efe6'; g.fillRect(cx - dw / 2 - 5, base - dh, dw + 10, dh);
        g.beginPath(); g.arc(cx, base - dh, dw / 2 + 5, Math.PI, 0); g.fill();
        g.fillStyle = c === 1 ? '#2f5f66' : '#5a3a2a'; g.fillRect(cx - dw / 2, base - dh, dw, dh);
        g.beginPath(); g.arc(cx, base - dh, dw / 2, Math.PI, 0); g.fill();
        // upper floors: tall shuttered windows
        for (let f = 1; f < stories; f++) {
          const fb = y(3 + 3.6 + (f - 1) * 3.4 + 0.5), ww = 0.95 * ppm, wh = 2.1 * ppm;
          g.fillStyle = '#f4efe6'; g.fillRect(cx - ww / 2 - 4, fb - wh - 6, ww + 8, wh + 8);
          g.fillStyle = '#26333d'; g.fillRect(cx - ww / 2, fb - wh, ww, wh);
          g.fillStyle = '#3f8f73';
          g.fillRect(cx - ww / 2 - 0.5 * ppm, fb - wh, 0.45 * ppm, wh); g.fillRect(cx + ww / 2 + 0.05 * ppm, fb - wh, 0.45 * ppm, wh);
          g.fillStyle = 'rgba(0,0,0,0.25)';
          for (let s = 0; s < wh; s += 6) { g.fillRect(cx - ww / 2 - 0.5 * ppm, fb - wh + s, 0.45 * ppm, 2); g.fillRect(cx + ww / 2 + 0.05 * ppm, fb - wh + s, 0.45 * ppm, 2); }
        }
      }
    });
    tex.anisotropy = 4;
    const geo = new THREE.BoxGeometry(10, Hm, 10);
    geo.translate(0, Hm / 2 - 3, 0);
    const uv = geo.attributes.uv;
    for (let k = 8; k < 16; k++) uv.setXY(k, 0.01, 0.55);       // roof / floor: plain wall colour
    return { geo, tex, top: Hm - 3 };
  }

  /* ---------- forest ---------- */
  trees() {
    const W = this.W, cfg = CONFIG.world, r = this.rnd, items = [], target = this.count(CONFIG.scenery.trees);
    let tries = 0;
    while (items.length < target && tries++ < target * 8) {
      let x, z;
      if (r() < 0.65) { x = -380 + (r() + r() + r() - 1.5) * 650; z = 520 + (r() + r() + r() - 1.5) * 620; }
      else { x = cfg.terrainCenter[0] + (r() - 0.5) * (cfg.terrainSize - 300); z = cfg.terrainCenter[1] + (r() - 0.5) * (cfg.terrainSize - 300); }
      if (W.landMask(x, z) < 0.96 || Math.hypot(x - this.townCenter[0], z - this.townCenter[1]) < 190) continue;
      const t = W.heightAt(x, z);
      if (t.h < 5 || t.h > 135 || t.d < 7 || t.type === SIDE.PROM || t.type === SIDE.BEACH_SEA || (t.type === SIDE.BEACH_IN && t.d < 120)) continue;
      const s = 0.75 + r() * 0.8, g = 0.8 + r() * 0.2;
      items.push({ m: M(x, t.h - 0.3, z, r() * 6.28, s, s * (0.85 + r() * 0.4), s), c: new THREE.Color(g, 0.9 + r() * 0.1, g * (0.85 + r() * 0.2)).getHex() });
    }
    this.instanced(Scenery.pineGeo(), this.vc, items, 2);
  }

  /* ---------- seafront boulevard ---------- */
  seafront() {
    const T = this.T, r = this.rnd, n = T.n, S = CONFIG.scenery;
    const pastel = [0xf7b7c3, 0xa8e0d0, 0xfde49e, 0xc9b8ec, 0xffc9a0, 0xa9d4f5, 0xf4a38c, 0xd2ecb0, 0xfff1d6, 0x9fd8e8];
    const lamps = [], heads = [], benches = [], cars = [], palms = [];
    for (const side of [-1, 1]) {
      let nextB = -1, nextL = -1, nextP = -1, nextC = -1;
      for (let i = 0; i < n; i++) {
        const type = this.sideType(i, side);
        if (type !== SIDE.PROM && type !== SIDE.SEA) continue;
        const e = this.edge(i), d = T.DIST[i], yawR = this.faceRoadYaw(i, side);
        if (d >= nextL) {                                         // streetlights on both sides
          const o = type === SIDE.SEA ? e + 0.35 : e + 1.0, dy = type === SIDE.SEA ? 0.85 : 0.02;
          const p = this.at(i, side * o, dy);
          lamps.push({ m: M(p.x, p.y, p.z, yawR) });
          heads.push({ m: M(p.x, p.y, p.z, yawR) });
          nextL = d + S.lampSpacing;
        }
        if (type !== SIDE.PROM) continue;
        if (d >= nextB) {                                         // colonial row
          const sx = 0.9 + r() * 0.45, sz = 1 + r() * 0.25, w = 10 * sx;
          const ic = this.ahead(i, w / 2);
          if (this.sideType(ic, side) === SIDE.PROM) {
            const ec = this.edge(ic), p = this.at(ic, side * (ec + 11 + 5 * sz), 0), yaw = this.faceRoadYaw(ic, side);
            this.addBuilding(p.x, p.y, p.z, yaw, sx, sz, 2 + Math.floor(r() * 3), pastel[Math.floor(r() * pastel.length)], true);
          }
          nextB = d + w + S.buildingGap[0] + r() * (S.buildingGap[1] - S.buildingGap[0]);
        }
        if (d >= nextP) {                                         // promenade palms + benches
          const p = this.at(i, side * (e + 8.5), 0.02);
          palms.push({ m: M(p.x, p.y, p.z, r() * 6.28, 0.8 + r() * 0.25), c: 0xffffff });
          const b = this.at(this.ahead(i, 8), side * (e + 6.2), 0.02);
          if (r() < 0.8) benches.push({ m: M(b.x, b.y, b.z, yawR) });
          nextP = d + 26 / Math.max(0.5, this.Q.density);
        }
        if (d >= nextC) {                                         // parked cars in a few stretches
          if (Math.floor(d / 90) % 2 === 0 && r() < 0.7) {
            const p = this.at(i, side * (e + 3.3), 0.02);
            cars.push({ m: M(p.x, p.y, p.z, this.fwdYaw(i) + (r() < 0.5 ? 0 : Math.PI)), c: pastel[Math.floor(r() * pastel.length)] });
          }
          nextC = d + 6.5;
        }
      }
    }
    // streetlight: pole + arm (+ glowing heads as a separate unlit mesh)
    const lampGeo = mergeGeos([
      [new THREE.CylinderGeometry(0.08, 0.13, 7, 6), 0x2e3b36, M(0, 3.5, 0)],
      [new THREE.CylinderGeometry(0.2, 0.25, 0.5, 6), 0x2e3b36, M(0, 0.25, 0)],
      [new THREE.BoxGeometry(0.08, 0.08, 1.9), 0x2e3b36, M(0, 6.95, 0.9)],
      [new THREE.BoxGeometry(0.42, 0.14, 0.6), 0x2e3b36, M(0, 6.88, 1.85)],
    ]);
    this.instanced(lampGeo, this.vc, lamps, 1);
    const headGeo = new THREE.BoxGeometry(0.34, 0.06, 0.5); headGeo.translate(0, 6.79, 1.85);
    this.instanced(headGeo, new THREE.MeshBasicMaterial({ color: 0xffe2a0 }), heads);
    const benchGeo = mergeGeos([
      [new THREE.BoxGeometry(1.8, 0.08, 0.5), 0x8a5a34, M(0, 0.46, 0)],
      [new THREE.BoxGeometry(1.8, 0.45, 0.06), 0x8a5a34, M(0, 0.78, -0.24, 0, 1, 1, 1, -0.15)],
      [new THREE.BoxGeometry(0.08, 0.46, 0.5), 0x2b2b2b, M(-0.75, 0.23, 0)],
      [new THREE.BoxGeometry(0.08, 0.46, 0.5), 0x2b2b2b, M(0.75, 0.23, 0)],
    ]);
    this.instanced(benchGeo, this.vc, benches, 1);
    const carGeo = mergeGeos([
      [new THREE.BoxGeometry(1.8, 0.65, 4.2), 0xffffff, M(0, 0.62, 0)],
      [new THREE.BoxGeometry(1.55, 0.55, 2.2), 0x29323c, M(0, 1.2, -0.25)],
      [new THREE.BoxGeometry(1.5, 0.06, 2.0), 0xffffff, M(0, 1.5, -0.25)],
      ...[[-0.8, 1.35], [0.8, 1.35], [-0.8, -1.35], [0.8, -1.35]].map(([x, z]) =>
        [new THREE.CylinderGeometry(0.33, 0.33, 0.25, 10), 0x151515, M(x, 0.33, z, 0, 1, 1, 1, 0, Math.PI / 2)]),
    ]);
    this.instanced(carGeo, this.vc, cars, 1);
    this.palmItems = palms;
  }

  addBuilding(x, y, z, yaw, sx, sz, stories, color, balconies) {
    this.buildings[stories].push({ m: M(x, y, z, yaw, sx, 1, sz), c: color });
    const top = 3.6 + (stories - 1) * 3.4 + 0.8;
    const fy = Math.sin(yaw), fz = Math.cos(yaw);
    this.cornices.push({ m: M(x, y + top - 0.15, z, yaw, sx, 1, sz), c: 0xf3ede2 });
    if (!balconies) return;
    for (let f = 1; f < stories; f++) {
      const ly = 3.6 + (f - 1) * 3.4, lz = 5 * sz;
      this.balconies.push({ m: M(x + fy * lz, y + ly, z + fz * lz, yaw), c: f % 2 ? 0xffffff : 0x3a3a3a });
    }
  }

  town() {
    const W = this.W, r = this.rnd, target = this.count(CONFIG.scenery.townBuildings), [cx, cz] = this.townCenter;
    const pastel = [0xf7b7c3, 0xa8e0d0, 0xfde49e, 0xffc9a0, 0xa9d4f5, 0xf4a38c, 0xfff1d6];
    let placed = 0, tries = 0;
    while (placed < target && tries++ < target * 20) {
      const a = r() * Math.PI * 2, rad = Math.sqrt(r()) * 170;
      const x = cx + Math.cos(a) * rad, z = cz + Math.sin(a) * rad;
      const t = W.heightAt(x, z);
      if (t.d < 30 || t.h < 4) continue;
      const h2 = W.heightAt(x + 7, z + 7).h, h3 = W.heightAt(x - 7, z - 7).h;
      if (Math.abs(h2 - h3) > 4) continue;
      this.addBuilding(x, Math.min(t.h, h2, h3), z, 0.35 + (r() < 0.5 ? 0 : Math.PI / 2), 0.8 + r() * 0.5, 0.8 + r() * 0.5,
        2 + Math.floor(r() * 2), pastel[Math.floor(r() * pastel.length)], false);
      placed++;
    }
  }

  flushBuildings() {
    for (const st of [2, 3, 4]) {
      const f = Scenery.facade(st);
      this.instanced(f.geo, new THREE.MeshLambertMaterial({ map: f.tex }), this.buildings[st], 1, true);
    }
    const cornice = new THREE.BoxGeometry(10.5, 0.4, 10.5);
    this.instanced(cornice, new THREE.MeshLambertMaterial(), this.cornices, 1);
    const balc = mergeGeos([
      [new THREE.BoxGeometry(3.2, 0.14, 1.0), 0xf2efe8, M(0, 0, 0.5)],
      [new THREE.BoxGeometry(3.2, 0.06, 0.06), 0xffffff, M(0, 0.95, 1.0)],
      [new THREE.BoxGeometry(3.1, 0.7, 0.03), 0xd8d8d8, M(0, 0.5, 1.0)],
      [new THREE.BoxGeometry(0.05, 0.95, 1.0), 0xffffff, M(-1.6, 0.47, 0.5)],
      [new THREE.BoxGeometry(0.05, 0.95, 1.0), 0xffffff, M(1.6, 0.47, 0.5)],
    ]);
    this.instanced(balc, this.vc, this.balconies, 1);
  }

  /* ---------- beach highway ---------- */
  beach() {
    const T = this.T, W = this.W, r = this.rnd, beachIdx = this.samplesOf('beach');
    const palms = this.palmItems || [], umbrellas = [], scrub = [], towers = [];
    const pick = () => beachIdx[Math.floor(r() * beachIdx.length)];
    const sideOf = (i, type) => (this.sideType(i, 1) === type ? 1 : this.sideType(i, -1) === type ? -1 : 0);
    // palm clusters on the sand
    for (let c = 0, tries = 0; c < this.count(CONFIG.scenery.palmClusters) && tries < 400; tries++) {
      const i = pick(), side = sideOf(i, SIDE.BEACH_SEA); if (!side) continue;
      const o = side * (this.edge(i) + 8 + r() * 60), p = this.at(i, o);
      const k = 3 + Math.floor(r() * 4);
      let ok = 0;
      for (let q = 0; q < k; q++) {
        const x = p.x + (r() - 0.5) * 14, z = p.z + (r() - 0.5) * 14, t = W.heightAt(x, z);
        if (t.h < 0.9 || t.h > 16 || t.d < 4) continue;
        palms.push({ m: M(x, t.h - 0.2, z, r() * 6.28, 0.8 + r() * 0.45, 0.75 + r() * 0.5), c: new THREE.Color(1, 0.92 + r() * 0.08, 0.85 + r() * 0.15).getHex() });
        ok++;
      }
      if (ok) c++;
    }
    // beach umbrellas near the waterline
    const cols = [0xe63946, 0xffd166, 0x118ab2, 0x06d6a0, 0xff7f50, 0xf4f1de];
    for (let tries = 0; umbrellas.length < this.count(CONFIG.scenery.umbrellas) && tries < 4000; tries++) {
      const i = pick(), side = sideOf(i, SIDE.BEACH_SEA); if (!side) continue;
      const p = this.at(i, side * (this.edge(i) + 12 + r() * 150)), t = W.heightAt(p.x, p.z);
      if (t.h < 0.7 || t.h > 3.6) continue;
      umbrellas.push({ m: M(p.x, t.h - 0.1, p.z, r() * 6.28, 1, 1, 1, (r() - 0.5) * 0.25), c: cols[Math.floor(r() * cols.length)] });
    }
    // lifeguard towers
    for (const f of [0.3, 0.62]) {
      const i = beachIdx[Math.floor(beachIdx.length * f)], side = sideOf(i, SIDE.BEACH_SEA); if (!side) continue;
      for (let o = this.edge(i) + 10; o < this.edge(i) + 220; o += 3) {
        const p = this.at(i, side * o), t = W.heightAt(p.x, p.z);
        if (t.h < 2.4) { towers.push({ m: M(p.x, t.h - 0.2, p.z, this.faceRoadYaw(i, side) + Math.PI) }); break; }
      }
    }
    // dunes scrub inland
    for (let tries = 0; scrub.length < this.count(CONFIG.scenery.scrub) && tries < 6000; tries++) {
      const i = pick(), side = sideOf(i, SIDE.BEACH_IN); if (!side) continue;
      const p = this.at(i, side * (this.edge(i) + 3 + r() * 100)), t = W.heightAt(p.x, p.z);
      if (t.h < 1.2 || t.d < 2) continue;
      const s = 0.5 + r() * 0.9;
      scrub.push({ m: M(p.x, t.h - 0.15, p.z, r() * 6.28, s * 1.3, s * 0.7, s), c: new THREE.Color().setHSL(0.17 + r() * 0.08, 0.35, 0.3 + r() * 0.12).getHex() });
    }

    this.instanced(Scenery.palmGeo(), this.vc2, palms, 1);
    const umb = mergeGeos([
      [new THREE.CylinderGeometry(0.035, 0.035, 2.5, 5), 0xdddddd, M(0, 1.25, 0)],
      [new THREE.ConeGeometry(1.5, 0.55, 8, 1, true), 0xffffff, M(0, 2.45, 0)],
      [new THREE.BoxGeometry(0.9, 0.04, 1.8), 0xffffff, M(0.9, 0.04, 0.8, 0.3)],
    ]);
    this.instanced(umb, this.vc2, umbrellas, 1);
    const tw = [];
    for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) tw.push([new THREE.BoxGeometry(0.14, 3.2, 0.14), 0xf2f2f2, M(x, 1.6, z)]);
    tw.push([new THREE.BoxGeometry(2.6, 0.16, 2.6), 0xe8e2d0, M(0, 3.2, 0)],
            [new THREE.BoxGeometry(2.0, 1.6, 2.0), 0xd8412f, M(0, 4.08, 0)],
            [new THREE.BoxGeometry(1.4, 0.6, 0.05), 0x2a3440, M(0, 4.3, 1.01)],
            [new THREE.BoxGeometry(2.8, 0.16, 2.8), 0xf4f4f4, M(0, 4.96, 0)],
            [new THREE.BoxGeometry(0.9, 0.08, 3.4), 0xe8e2d0, M(0, 1.6, 2.6, 0, 1, 1, 1, -0.95)],
            [new THREE.BoxGeometry(0.06, 1.6, 0.06), 0xd8412f, M(1.2, 5.8, 1.2)]);
    this.instanced(mergeGeos(tw), this.vc, towers, 1);
    this.instanced(new THREE.IcosahedronGeometry(0.9, 0), new THREE.MeshLambertMaterial(), scrub, 0);
  }

  /* ---------- mountain pass ---------- */
  mountain() {
    const T = this.T, n = T.n, items = [];
    // guardrail posts every 4 m on drop-off sides
    for (const side of [-1, 1]) {
      let next = -1;
      for (let i = 0; i < n; i++) {
        if (this.sideType(i, side) !== SIDE.DROP || T.DIST[i] < next) continue;
        const p = this.at(i, side * (this.edge(i) + 0.2), -0.35);
        items.push({ m: M(p.x, p.y, p.z, this.fwdYaw(i), 0.14, 1.15, 0.14) });
        next = T.DIST[i] + 4;
      }
    }
    const postGeo = new THREE.BoxGeometry(1, 1, 1); postGeo.translate(0, 0.5, 0);
    this.instanced(postGeo, new THREE.MeshLambertMaterial({ color: 0x80878d }), items, 0);

    // Hairpins: chevrons on the outside + 150/100/50 m braking boards
    const chevrons = [], boards = { 150: [], 100: [], 50: [] };
    for (const hp of this.hairpins()) {
      const side = -hp.turn;                                     // outside of the bend
      for (let i = hp.a - 6; i <= hp.b + 6; i += 3) {
        const k = (i + n) % n, e = this.edge(k), p = this.at(k, side * (e + 0.25));
        const tx = T.RZ[k], tz = -T.RX[k];
        const fx = -side * T.RX[k] * 0.55 - tx, fz = -side * T.RZ[k] * 0.55 - tz;
        const yaw = Math.atan2(fx, fz);
        this.posts.push({ m: M(p.x, p.y - 0.3, p.z, yaw, 0.09, 1.4, 0.09) });
        chevrons.push({ m: M(p.x, p.y + 1.45, p.z, yaw, hp.turn, 1, 1) });
      }
      for (const dist of [150, 100, 50]) {
        const k = this.ahead(hp.a, -dist), e = this.edge(k), p = this.at(k, side * (e + 0.35));
        const yaw = Math.atan2(-T.RZ[k], T.RX[k]);               // faces oncoming traffic
        this.posts.push({ m: M(p.x, p.y - 0.3, p.z, yaw, 0.09, 1.6, 0.09) });
        boards[dist].push({ m: M(p.x, p.y + 1.75, p.z, yaw) });
      }
    }
    const chevTex = canvasTexture(128, 96, (g, w, h) => {
      g.fillStyle = '#d8231f'; g.fillRect(0, 0, w, h);
      g.fillStyle = '#fff';
      for (const ox of [-26, 14]) {
        g.beginPath(); g.moveTo(w / 2 + ox - 10, 14); g.lineTo(w / 2 + ox + 18, h / 2); g.lineTo(w / 2 + ox - 10, h - 14);
        g.lineTo(w / 2 + ox + 4, h - 14); g.lineTo(w / 2 + ox + 32, h / 2); g.lineTo(w / 2 + ox + 4, 14); g.closePath(); g.fill();
      }
      g.strokeStyle = '#fff'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
    });
    const plane = (w, h) => new THREE.PlaneGeometry(w, h);
    this.instanced(plane(1.15, 0.86), new THREE.MeshLambertMaterial({ map: chevTex, side: THREE.DoubleSide }), chevrons, 1);
    for (const dist of [150, 100, 50]) {
      const tex = canvasTexture(128, 96, (g, w, h) => {
        g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
        g.strokeStyle = '#d8231f'; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
        g.fillStyle = '#111'; g.font = 'bold 54px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(String(dist), w / 2, h / 2 + 3);
      });
      this.instanced(plane(1.3, 0.98), new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide }), boards[dist], 1);
    }
  }

  hairpins() {
    const T = this.T, n = T.n, list = [];
    for (let i = 0; i < n;) {
      if (T.sectionKeys[T.SEC[i]] === 'mountain' && T.radius[i] < 45) {
        let j = i; while (j + 1 < n && T.radius[j + 1] < 45) j++;
        if (j - i >= 4) list.push({ a: i, b: j, turn: T.turn[(i + j) >> 1] });
        i = j + 1;
      } else i++;
    }
    return list;
  }

  /* ---------- district entry signs ---------- */
  districtSigns() {
    const T = this.T, n = T.n;
    const style = { seafront: ['#1f6fd1', 'DISTRICT 1'], beach: ['#ff7a1a', 'DISTRICT 2'], mountain: ['#2f8a3a', 'DISTRICT 3'] };
    for (let i = 0; i < n; i++) {
      const prev = T.SEC[(i - 1 + n) % n];
      if (prev === T.SEC[i]) continue;
      const key = T.sectionKeys[T.SEC[i]], sec = T.cfg.sections[key], k = this.ahead(i, 25);
      const side = [SIDE.SEA, SIDE.DROP, SIDE.BEACH_SEA].includes(this.sideType(k, 1)) ? -1 : 1;
      const p = this.at(k, side * (this.edge(k) + 1.5)), yaw = Math.atan2(-T.RZ[k], T.RX[k]);
      const [color, sub] = style[key];
      const tex = canvasTexture(1024, 256, (g, w, h) => {
        g.fillStyle = '#fbf7ee'; g.fillRect(0, 0, w, h);
        g.fillStyle = color; g.fillRect(0, 0, w, 52); g.fillRect(0, h - 22, w, 22);
        g.fillStyle = '#fff'; g.font = 'bold 34px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('ISLA RUSH  •  ' + sub, w / 2, 28);
        g.fillStyle = '#1b1f24'; g.font = '900 96px system-ui, sans-serif';
        g.fillText(sec.name.toUpperCase(), w / 2, 140);
      });
      tex.anisotropy = 4;
      this.instanced(new THREE.PlaneGeometry(8, 2), new THREE.MeshLambertMaterial({ map: tex, side: THREE.DoubleSide }),
        [{ m: M(p.x, p.y + 3.2, p.z, yaw) }], 1);
      const fx = Math.cos(yaw), fz = -Math.sin(yaw);
      for (const s of [-3.4, 3.4]) this.posts.push({ m: M(p.x + fx * s, p.y - 0.3, p.z + fz * s, yaw, 0.16, 4.3, 0.16) });
    }
  }

  flushPosts() {
    const g = new THREE.BoxGeometry(1, 1, 1); g.translate(0, 0.5, 0);
    this.instanced(g, new THREE.MeshLambertMaterial({ color: 0x9aa0a6 }), this.posts, 1);
  }

  /* ---------- horizon: lighthouse, offshore islands ---------- */
  distant() {
    const r = this.rnd, cfg = CONFIG.world;
    // lighthouse on a rocky islet off the south-east point
    const parts = [[new THREE.DodecahedronGeometry(1, 0), 0x8a8274, M(0, -2, 0, 0, 26, 10, 20)]];
    for (let b = 0; b < 6; b++) {
      const r0 = 2.6 - b * 0.18, r1 = 2.6 - (b + 1) * 0.18;
      parts.push([new THREE.CylinderGeometry(r1, r0, 3.2, 12), b % 2 ? 0xd8412f : 0xf6f4ee, M(0, 6 + b * 3.2 + 1.6, 0)]);
    }
    parts.push([new THREE.CylinderGeometry(2.3, 2.3, 0.4, 12), 0x2b2b2b, M(0, 25.4, 0)],
               [new THREE.CylinderGeometry(1.2, 1.2, 2.2, 10), 0xfff1b8, M(0, 26.7, 0)],
               [new THREE.ConeGeometry(1.6, 1.8, 10), 0xc8341f, M(0, 28.7, 0)],
               [new THREE.BoxGeometry(5, 3, 4), 0xf6f4ee, M(5, 6.5, 0)], [new THREE.BoxGeometry(5.4, 0.4, 4.4), 0xc8341f, M(5, 8.1, 0)]);
    const lh = new THREE.Mesh(mergeGeos(parts), this.vc);
    lh.position.set(1040, 0, -880);
    lh.castShadow = false;
    this.scene.add(lh);
    // offshore islands for a busy horizon
    const isl = [];
    for (let k = 0; k < 9; k++) {
      const a = k / 9 * Math.PI * 2 + r() * 0.4, d = 2300 + r() * 700;
      const s = 250 + r() * 380, h = 70 + r() * 220;
      isl.push({ m: M(cfg.terrainCenter[0] + Math.cos(a) * d, -4, cfg.terrainCenter[1] + Math.sin(a) * d, r() * 6, s, h, s * (0.6 + r() * 0.6)),
                 c: new THREE.Color(0.75 + r() * 0.15, 0.85 + r() * 0.1, 0.8).getHex() });
    }
    const islGeo = mergeGeos([
      [new THREE.ConeGeometry(1, 1, 14, 1), 0x4f7a4a, M(0, 0.5, 0)],
      [new THREE.CylinderGeometry(1.06, 1.12, 0.03, 14), 0xd9c493, M(0, 0.015, 0)],
    ]);
    this.instanced(islGeo, this.vc, isl, 0);
  }
}

/* =====================================================================
 * CAR
 * Model is built facing +Z (local +X = left, +Y = up).
 * Hierarchy: root (position, yaw, slope pitch) → body (weight-transfer
 * pitch/roll) + wheels (steer pivot → spin).
 * Parts are merged per material to keep draw calls low.
 * ===================================================================== */
function buildCarModel(cfg, env, quality) {
  const root = new THREE.Group();
  root.rotation.order = 'YXZ';
  const body = new THREE.Group();
  root.add(body);

  // Glossy paint: clear-coat (High), env-reflective metallic (Medium), strong specular (Low)
  let paint, glass;
  if (quality.paint === 'physical' && env) {
    paint = new THREE.MeshPhysicalMaterial({ color: cfg.color, metalness: 0.35, roughness: 0.4, clearcoat: 1, clearcoatRoughness: 0.05, envMap: env, envMapIntensity: 1.2 });
  } else if (env) {
    paint = new THREE.MeshStandardMaterial({ color: cfg.color, metalness: 0.45, roughness: 0.25, envMap: env, envMapIntensity: 1.1 });
  } else {
    paint = new THREE.MeshPhongMaterial({ color: cfg.color, shininess: 200, specular: 0x302a24 });
    paint.color.multiplyScalar(0.62);   // Phong + warm sun + sky light would clip the orange to yellow
  }
  glass = env ? new THREE.MeshStandardMaterial({ color: 0x0e1820, metalness: 0.9, roughness: 0.06, envMap: env })
              : new THREE.MeshPhongMaterial({ color: 0x1d2c3a, shininess: 140, specular: 0xaabbcc });
  const trim = new THREE.MeshLambertMaterial({ vertexColors: true });
  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff4d2 });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0x8c1010 });

  const extrude = (shape, width, bevel) => {
    const g = new THREE.ExtrudeGeometry(shape, { depth: width, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, steps: 1 });
    g.rotateY(-Math.PI / 2);
    g.translate(width / 2, 0, 0);
    return g;
  };

  // Lower body side profile (x = length axis, y = height) with wheel arches
  const fa = cfg.frontAxle, ra = cfg.frontAxle - cfg.wheelbase, wr = cfg.wheelRadius, ar = wr + 0.08;
  const s = new THREE.Shape();
  s.moveTo(-2.18, 0.3);
  const archPts = (cz) => { for (let a = 180; a >= 0; a -= 30) { const r = a * Math.PI / 180; s.lineTo(cz + Math.cos(r) * ar, wr + Math.sin(r) * ar); } };
  s.lineTo(ra - ar, 0.3); archPts(ra); s.lineTo(ra + ar, 0.3);
  s.lineTo(fa - ar, 0.3); archPts(fa); s.lineTo(fa + ar, 0.3);
  s.lineTo(2.12, 0.3); s.lineTo(2.27, 0.48); s.lineTo(2.2, 0.66); s.lineTo(1.2, 0.84); s.lineTo(0.55, 0.9);
  s.lineTo(-1.55, 0.94); s.lineTo(-2.2, 0.9); s.lineTo(-2.27, 0.55); s.lineTo(-2.18, 0.3);

  const c = new THREE.Shape();
  c.moveTo(0.62, 0.88); c.lineTo(-0.2, 1.28); c.lineTo(-0.95, 1.3); c.lineTo(-1.82, 0.92); c.lineTo(-1.82, 0.88); c.lineTo(0.62, 0.88);

  const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const paintParts = [[extrude(s, cfg.width - 0.12, 0.06), 0xffffff], [B(1.44, 0.05, 0.8), 0xffffff, M(0, 1.335, -0.57)]];
  const trimParts = [
    [B(1.0, 0.14, 0.06), 0x18191d, M(0, 0.45, 2.26)],                      // grille
    [B(1.55, 0.12, 0.3), 0x18191d, M(0, 0.34, -2.15)],                     // diffuser
    [B(1.7, 0.06, 0.12), 0x18191d, M(0, 0.31, 2.18)],                      // splitter
    [B(1.62, 0.05, 0.34), 0x18191d, M(0, 1.14, -2.02)],                    // spoiler wing
    [B(0.3, 0.012, 1.6), 0xffffff, M(0, 0.9, 0.95, 0, 1, 1, 1, -0.105)],    // hood stripe
  ];
  const headParts = [], tailParts = [];
  for (const sx of [-1, 1]) {
    headParts.push([B(0.42, 0.1, 0.08), 0xffffff, M(sx * 0.6, 0.62, 2.2, 0, 1, 1, 1, -0.35)]);
    tailParts.push([B(0.44, 0.09, 0.05), 0xffffff, M(sx * 0.58, 0.8, -2.27)]);
    trimParts.push([B(0.06, 0.1, 2.0), 0x18191d, M(sx * 0.95, 0.34, 0.05)],  // side skirts
                   [B(0.06, 0.2, 0.1), 0x18191d, M(sx * 0.55, 1.03, -1.98)]); // spoiler posts
    paintParts.push([B(0.16, 0.1, 0.12), 0xffffff, M(sx * 0.9, 0.98, 0.45)]); // mirrors
  }
  const parts = [
    new THREE.Mesh(mergeGeos(paintParts), paint),
    new THREE.Mesh(extrude(c, 1.48, 0.05), glass),
    new THREE.Mesh(mergeGeos(trimParts), trim),
    new THREE.Mesh(mergeGeos(headParts), headMat),
    new THREE.Mesh(mergeGeos(tailParts), tailMat),
  ];
  for (const p of parts) { p.castShadow = quality.shadows; body.add(p); }

  // Brake-light glow (additive quads behind the tail lights, shown while braking)
  const glowTex = canvasTexture(64, 64, (g, w, h) => {
    const grd = g.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
